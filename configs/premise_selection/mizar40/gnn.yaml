# @package _global_
defaults:
  - mizar
  - /data_type/gnn@_here_

exp_config:
  name: gnn_pickle  

model:
  goal_embedding_module:
    _target_: models.embedding_models.gnn.formula_net.formula_net.FormulaNetEdges
    input_shape: 15000    # <-- manually set vocab size
    embedding_dim: 128
    num_iterations: 4
    batch_norm: true

  premise_embedding_module:
    _target_: models.embedding_models.gnn.formula_net.formula_net.FormulaNetEdges
    input_shape: 15000    # <-- manually set vocab size
    embedding_dim: 128
    num_iterations: 4
    batch_norm: true

trainer:
  strategy: auto
  accelerator: gpu     
  devices: 1
  max_epochs: 30        
  log_every_n_steps: 20

data_config:
  data_options:
    pickle_path: /kaggle/input/mizar40/mizar_pickles  
    mongo: false
